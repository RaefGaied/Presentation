<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 17 : Conception — Cas d'utilisation &amp; Diagramme de classes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../nav-hint.css">
    <link rel="stylesheet" href="../calm-override.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>

    <div class="slide">

        <header class="slide__header">
            <span class="slide__eyebrow" id="slideEyebrow">CONCEPTION &middot; DIAGRAMMES UML</span>
            <h1 class="slide__title" id="slideTitle">Cas d'utilisation &amp; Diagramme de classes</h1>
            <p class="slide__subtitle" id="slideSubtitle">Vue fonctionnelle et structure interne du syst&egrave;me FinBank</p>

            <!-- Conception Progression Switcher -->
            <div class="conception-nav" role="tablist" aria-label="Étapes de conception">
                <button class="conception-tab is-active" id="tabUc" role="tab" aria-selected="true" data-view="uc">
                    <span class="tab-badge">01</span>
                    <span class="tab-text">
                        <span class="tab-title">Cas d'utilisation</span>
                        <span class="tab-meta">Vue Fonctionnelle</span>
                    </span>
                </button>
                <div class="conception-nav-arrow" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                </div>
                <button class="conception-tab" id="tabClasses" role="tab" aria-selected="false" data-view="classes">
                    <span class="tab-badge">02</span>
                    <span class="tab-text">
                        <span class="tab-title">Diagramme de classes</span>
                        <span class="tab-meta">Structure Interne</span>
                    </span>
                </button>
            </div>
        </header>

        <div class="uc-section" data-delay="1">
            <div class="uc-container" id="diagramContainer">

                <!-- View 1: Use Case Diagram -->
                <div class="diagram-pane is-active" id="paneUc">
                    <div class="uc-zoom-wrapper" id="zoomWrapperUc">
                        <img src="../assets/use-case-globale.png" alt="Diagramme de cas d'utilisation global FinBank" class="uc-diagram" id="ucDiagram">
                    </div>
                </div>

                <!-- View 2: Class Diagram -->
                <div class="diagram-pane" id="paneClasses">
                    <div class="uc-zoom-wrapper" id="zoomWrapperClasses">
                        <img src="../assets/class-diagram-global.png" alt="Diagramme de classes global FinBank" class="uc-diagram" id="classDiagram">
                    </div>
                </div>

                <!-- Floating Zoom & Controls Bar -->
                <div class="diagram-toolbar" aria-label="Commandes du diagramme">
                    <button class="tool-btn" id="btnZoomOut" title="Zoom arrière (-)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    </button>
                    <span class="zoom-level" id="zoomLevel">100%</span>
                    <button class="tool-btn" id="btnZoomIn" title="Zoom avant (+)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    </button>
                    <button class="tool-btn" id="btnReset" title="Réinitialiser zoom">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><polyline points="3 3 3 8 8 8"/></svg>
                    </button>
                    <span class="toolbar-sep"></span>
                    <button class="tool-btn tool-btn--text" id="btnToggleStep" title="Passer à l'étape suivante">
                        <span id="btnToggleStepText">Structure interne &rarr;</span>
                    </button>
                </div>

            </div>
        </div>

        <div class="navigation">
            <span class="nav-year">17 / 34</span>
        </div>

    </div>

    <script src="../slide-enter.js"></script>
    <script src="script.js"></script>
    <script src="../nav.js"></script>
    <script src="../transition.js"></script>
</body>
</html>
